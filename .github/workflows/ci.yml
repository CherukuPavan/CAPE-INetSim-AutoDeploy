name: AutoDeploy CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev/v1-orchestrator-hardening
      - prod/final-production-hardening

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Syntax
        run: bash tests/syntax.sh
      - name: Python syntax
        run: |
          python3 -m py_compile tools/*.py
      - name: Production assumption guard
        run: bash tests/no_machine_specific_assumptions.sh
      - name: Production fresh/upgrade/broken/custom-layout matrix
        run: bash tests/production_matrix.sh
      - name: Pre-change inventory schema
        run: bash tests/inventory_logic.sh
      - name: End-to-end selftest wiring
        run: bash tests/selftest_logic.sh
      - name: Universal discovery logic
        run: bash tests/universal_logic.sh
      - name: Multi-machine CAPE target-set logic
        run: bash tests/multi_target_logic.sh
      - name: Multi-machine transactional cutover
        run: bash tests/multi_target_deploy.sh
      - name: Multi-machine transactional rollback
        run: bash tests/multi_target_rollback.sh
      - name: Live host preflight discovery
        run: bash tests/live_host_preflight.sh
      - name: Modular nwfilter runtime lifecycle
        run: bash tests/nwfilter_runtime.sh
      - name: Collector redaction safety
        run: bash tests/collector_redaction.sh
      - name: State ownership logic
        run: bash tests/state_logic.sh
      - name: Transaction backup logic
        run: bash tests/transaction_logic.sh
      - name: Rollback safety ordering
        run: bash tests/rollback_logic.sh
      - name: Rollback-incomplete automatic recovery
        run: bash tests/rollback_incomplete_recovery.sh
      - name: Isolated network XML safety
        run: bash tests/network_xml.sh
      - name: Host fake-Internet firewall safety
        run: bash tests/firewall_logic.sh
      - name: Appliance manifest gates
        run: bash tests/appliance_manifest.sh
      - name: Appliance build pin/generalization
        run: bash tests/appliance_build_static.sh
      - name: Appliance domain logic
        run: bash tests/inetsim_vm_logic.sh
      - name: QGA transient recovery logic
        run: bash tests/qga_logic.sh
      - name: Windows VM logic
        run: bash tests/windows_vm_logic.sh
      - name: CAPE snapshot internal/external memory modes
        run: bash tests/snapshot_memory_modes.sh
      - name: Windows management hypervisor guard
        run: bash tests/windows_network_guard.sh
      - name: Windows management DHCP alignment
        run: bash tests/windows_management_dhcp.sh
      - name: Windows management backend
        run: bash tests/windows_backend.sh
      - name: Windows controller
        run: bash tests/windows_control.sh
      - name: INI editor
        run: bash tests/ini_edit.sh
      - name: CAPE configuration patch
        run: bash tests/cape_config_logic.sh
      - name: CAPE maintenance helper
        run: bash tests/maintenance_tool.sh
      - name: CAPE virtualenv and service-user runtime
        run: sudo env CAPE_RUNTIME_TEST_REQUIRE_NONROOT=1 python3 tests/cape_runtime.py
      - name: CAPE final service readiness
        run: bash tests/service_readiness.sh
      - name: Frozen extension constants
        run: bash tests/extension_logic.sh
      - name: Real-task acceptance logic
        run: bash tests/acceptance_logic.sh
      - name: Recovery validation
        run: bash tests/recovery_validation.sh
      - name: Release packaging policy
        run: bash tests/release_logic.sh
      - name: Workflow notification policy
        run: bash tests/workflow_policy.sh
