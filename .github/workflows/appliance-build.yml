name: Build generalized INetSim appliance

on:
  workflow_dispatch:
  push:
    branches:
      - dev/v1-orchestrator-hardening
    paths:
      - appliance/**
      - .github/workflows/appliance-build.yml

permissions:
  contents: read

concurrency:
  group: appliance-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned Ubuntu base image
        uses: actions/cache@v4
        with:
          path: ~/.cache/cape-inetsim-autodeploy/base
          key: ubuntu-noble-20260801-0533b0655c32e68b31d792ecd6ccfca95abdbc536c4446874fe0513bd4140ffe

      - name: Install image build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libguestfs-tools qemu-utils qemu-system-x86 cloud-image-utils
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          # libguestfs/supermin needs the runner user to read a host kernel.
          sudo chmod a+r /boot/vmlinuz-* /boot/initrd.img-* 2>/dev/null || true

      - name: Build generalized QCOW2
        id: appliance_build
        continue-on-error: true
        env:
          LIBGUESTFS_BACKEND: direct
          LIBGUESTFS_MEMSIZE: 1024
          APPLIANCE_BASE_CACHE: /home/runner/.cache/cape-inetsim-autodeploy/base
          APPLIANCE_DIAG_DIR: ${{ runner.temp }}/appliance-diag
        run: |
          chmod +x appliance/build/build.sh appliance/image-rootfs-prepare.sh appliance/guest-configure.sh
          appliance/build/build.sh "$RUNNER_TEMP/cape-inetsim-appliance-v1.0.0.qcow2"

      - name: Verify generalized QCOW2
        id: appliance_verify
        if: steps.appliance_build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/appliance-diag"
          chmod +x appliance/build/verify-artifact.sh
          set -o pipefail
          appliance/build/verify-artifact.sh "$RUNNER_TEMP/cape-inetsim-appliance-v1.0.0.qcow2" \
            2>&1 | tee "$RUNNER_TEMP/appliance-diag/artifact-verify.log"

      - name: Create candidate verification evidence
        if: steps.appliance_build.outcome == 'success' && steps.appliance_verify.outcome == 'success'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/appliance-evidence"
          mkdir -p "$EVIDENCE"
          cp "$RUNNER_TEMP/cape-inetsim-appliance-v1.0.0.qcow2.sha256" "$EVIDENCE/"
          cp "$RUNNER_TEMP/cape-inetsim-appliance-v1.0.0.qcow2.info.txt" "$EVIDENCE/"
          cp "$RUNNER_TEMP/appliance-diag/artifact-verify.log" "$EVIDENCE/"
          cp appliance/build/base-image.json "$EVIDENCE/base-image.json"
          python3 - "$EVIDENCE" "$SOURCE_SHA" <<'PY'
import json,pathlib,sys
root=pathlib.Path(sys.argv[1])
sha=sys.argv[2]
base=json.loads((root/"base-image.json").read_text())
qcow_sha=(root/"cape-inetsim-appliance-v1.0.0.qcow2.sha256").read_text().split()[0]
(root/"candidate-provenance.json").write_text(json.dumps({
    "schema":1,
    "source_commit":sha,
    "artifact_name":"cape-inetsim-appliance-v1.0.0.qcow2",
    "qcow2_sha256":qcow_sha,
    "base_release_build":base["release_build"],
    "base_sha256":base["sha256"],
    "independent_verifier":"PASS"
},indent=2)+"\n")
PY

      - name: Upload candidate verification evidence
        if: steps.appliance_build.outcome == 'success' && steps.appliance_verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cape-inetsim-appliance-v1.0.0-evidence
          path: ${{ runner.temp }}/appliance-evidence
          retention-days: 30

      - name: Upload build candidate
        if: steps.appliance_build.outcome == 'success' && steps.appliance_verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cape-inetsim-appliance-v1.0.0-candidate
          path: |
            ${{ runner.temp }}/cape-inetsim-appliance-v1.0.0.qcow2
            ${{ runner.temp }}/cape-inetsim-appliance-v1.0.0.qcow2.sha256
            ${{ runner.temp }}/cape-inetsim-appliance-v1.0.0.qcow2.info.txt
          retention-days: 7
          compression-level: 0

      - name: Upload failure diagnostics
        if: steps.appliance_build.outcome != 'success' || steps.appliance_verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cape-inetsim-appliance-build-diagnostics
          path: ${{ runner.temp }}/appliance-diag
          if-no-files-found: warn
          retention-days: 7

      - name: Final candidate outcome
        if: always()
        run: |
          echo "appliance_build_outcome=${{ steps.appliance_build.outcome }}"
          echo "appliance_verify_outcome=${{ steps.appliance_verify.outcome }}"
          if [[ "${{ steps.appliance_build.outcome }}" != "success" || "${{ steps.appliance_verify.outcome }}" != "success" ]]; then
            echo "::error::Appliance candidate build/verification did not pass. No candidate is publishable."
            exit 1
          fi
          echo "Appliance candidate build and independent verification passed."
